# Publishes dist/ to npm when a version tag (v1.2.3) is pushed. The tag must match package.json.
name: Release
on:
  push: { tags: ['v*.*.*'] }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm run test:coverage && npm run build
      - run: npm publish ./dist --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
