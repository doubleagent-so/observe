# Publishes dist/ to npm when a version tag (v1.2.3) is pushed. The tag must match package.json. A version already on
# npm (published by hand) is tested and built but not published again.
name: Release
on:
  push: { tags: ['v*.*.*'] }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm run test:coverage && npm run build
      - id: npm
        run: |
          if npm view "$(node -p 'require(`./package.json`).name')@$(node -p 'require(`./package.json`).version')" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish ./dist --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
